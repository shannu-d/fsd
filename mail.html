<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Container for centering and styling */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3d04e;
        }

        /* Styling the form */
        form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        /* Styling the form groups to align items side by side */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Styling for labels to make them bold and adjust layout */
        label {
            font-size: 16px;
            font-weight: bold; /* Make labels bold */
            width: 100px; /* Fixed width for labels */
            text-align: right; /* Align text to the right */
            margin-right: 10px; /* Space between label and input */
        }

        /* Styling for input fields */
        input {
            border: 2px solid #d3d3d3;
            border-radius: 4px;
            width: 150px; /* Adjust width for input fields */
            padding: 10px;
            outline: none;
        }

        input:focus {
            border-color: skyblue;
        }
    </style>
</head>
<body style="background-color:#e6c379">

    <!-- Main container -->
    <div class="container">
        <!-- Form inside the container -->
        <form action="" method="post">
            <div class="form-group">
                <label for="Email">Email:</label>
                <input type="email" id="Email" name="Email">
            </div>

            <div class="form-group">
                <label for="Name">Name:</label>
                <input type="text" id="Name" name="Name">
            </div>

            <div class="form-group">
                <label for="Surname">Surname:</label>
                <input type="text" id="Surname" name="Surname">
            </div>
        </form>
    </div>

</body>
</html>
