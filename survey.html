<!DOCTYPE html>
<html>
<head>
    <title>SURVEY FORM</title>
</head>
<body bgcolor="orange">

    <div align="center">
        <table bgcolor="white" width="50%" cellpadding="20" cellspacing="0">
            <tr>
                <td align="center">
                    <h1><font color="black"><b>SURVEY FORM</b></font></h1>
                    <p>User stories survey form</p>

                    <form>
                        <table cellpadding="10">
                            <tr>
                                <td align="right"><font color="black">Name:</font></td>
                                <td><input type="text" name="name" size="30"></td>
                            </tr>
                            
                            <tr>
                                <td align="right"><font color="black">Email:</font></td>
                                <td><input type="email" name="email" size="30"></td>
                            </tr>

                            <tr>
                                <td align="right"><font color="black">Work Experience:</font></td>
                                <td><input type="text" name="experience" size="30"></td>
                            </tr>

                            <tr>
                                <td align="right"><font color="black">Are you comfortable investing in real estate on a platform without first investing properly?</font></td>
                                <td><input type="text" name="investment_comfort" size="30"></td>
                            </tr>

                            <tr>
                                <td align="right"><font color="black">Suggestions to build a trusted platform:</font></td>
                                <td><input type="text" name="suggestions" size="30"></td>
                            </tr>

                            <tr>
                                <td align="right"><font color="black">You are ready to invest in:</font></td>
                                <td>
                                    <label><input type="checkbox" name="investment" value="Real Estate"> Real Estate</label><br>
                                    <label><input type="checkbox" name="investment" value="Mutual Funds"> Mutual Funds</label><br>
                                    <label><input type="checkbox" name="investment" value="Crypto Currency"> Crypto Currency</label><br>
                                    <label><input type="checkbox" name="investment" value="Stocks & Bonds"> Stocks & Bonds</label>
                                </td>
                            </tr>

                            <tr>
                                <td align="right"><font color="black">Are you ready for further contact?</font></td>
                                <td>
                                    <label><input type="radio" name="contact" value="yes"> Yes</label>
                                    <label><input type="radio" name="contact" value="no"> No</label>
                                </td>
                            </tr>

                            <tr>
                                <td colspan="2" align="center">
                                    <input type="submit" value="SUBMIT" 
                                        style="background-color: orange; 
                                               color: white; 
                                               font-size: 20px; 
                                               padding: 15px 30px; 
                                               border: none; 
                                               cursor: pointer; 
                                               font-weight: bold;">
                                </td>
                            </tr>
                        </table>
                    </form>

                </td>
            </tr>
        </table>
    </div>

</body>
</html>
