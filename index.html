<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #fff;
        }
        header h1 {
            font-size: 36px;
            letter-spacing: 2px;
            margin: 0;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 8px 12px;
            transition: color 0.3s, transform 0.3s;
        }
        nav ul li a:hover {
            color: #2575fc;
            transform: scale(1.1);
        }
        main {
            text-align: center;
            padding: 60px 20px;
        }
        main h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }
        main p {
            font-size: 20px;
            margin: 20px 0;
            color: #f2f2f2;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }
        .button-container button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .button-container button:hover {
            background-color: #2575fc;
            transform: translateY(-3px);
        }
        .button-container button:active {
            transform: translateY(2px);
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            position: absolute;
            width: 100%;
            bottom: 0;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Website</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Explore Our Content</h1>
        <p>Discover exciting content through the buttons below!</p>
        
        <div class="button-container">
            <button onclick="window.location.href='steve.html'">Steve</button>
            <button onclick="window.location.href='survey.html'">Survey</button>
            <button onclick="window.location.href='girl.html'">Girl</button>
            <button onclick="window.location.href='audio.html'">Audio</button>
            <button onclick="window.location.href='card.html'">Card</button>
            <button onclick="window.location.href='login.html'">Login</button>
            <button onclick="window.location.href='movie.html'">Movie</button>
            <button onclick="window.location.href='mail.html'">Mail</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Your Website | All Rights Reserved</p>
    </footer>
</body>
</html>
