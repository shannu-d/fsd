<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* Light background for a soft feel */
            margin: 0;
            padding: 0;
            color: #333; /* Dark text for readability */
        }
        header {
            background-color: #1e3d58; /* Dark blue header for a professional look */
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        nav ul li {
            margin: 0 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }
        nav ul li a:hover {
            color: #ff6347; /* Tomato color for hover effect */
            text-decoration: underline;
        }
        main {
            text-align: center;
            padding: 50px;
            background-color: #ffffff; /* White background for the content area */
            margin: 30px auto;
            max-width: 1100px;
            border-radius: 8px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 36px;
            color: #1e3d58; /* Dark blue title */
        }
        p {
            font-size: 18px;
            color: #555;
            margin: 20px 0;
        }
        .button-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .button-container button {
            margin: 10px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #1e3d58; /* Matching button color with header */
            color: white;
            border: none;
            border-radius: 30px;
            transition: background-color 0.3s, transform 0.2s;
        }
        .button-container button:hover {
            background-color: #ff6347; /* Tomato hover effect for buttons */
            transform: translateY(-2px); /* Slight lift on hover */
        }
        .button-container button:active {
            transform: translateY(1px); /* Button "press" effect */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Welcome to the  Homepage</h1>
        <p>This is the main page </p>
        <p>more rating more happy</p>
        <p>no rating... no happy for you </p>
        <div class="button-container">
            <button onclick="window.location.href='stevee.html'">Steve</button>
            <button onclick="window.location.href='survey.html'">Survey</button>
            <button onclick="window.location.href='girl.html'">Girl</button>
            <button onclick="window.location.href='icon.html'">Audio</button>
            <button onclick="window.location.href='card.html'">Card</button>
            <button onclick="window.location.href='login.html'">Login</button>
            <button onclick="window.location.href='ironman.html'">Movie</button>
            <button onclick="window.location.href='mail.html'">Mail</button>
        </div>
    </main>
</body>
</html>
